        ];

        let carrito = {}; 
        let categoriaActual = 'todos';
        const minimoParaEnvio = 15000;
        const stockMaximo = 10;

        function renderizarProductos(listaAProcesar) {
            const contenedor = document.getElementById('contenedor-productos');
            let html = '';
            
            listaAProcesar.forEach(prod => {
                html += `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                    <div class="h-36 bg-gray-100 overflow-hidden flex items-center justify-center p-2">

                             onerror="this.onerror=function(){this.onerror=function(){this.src='https://images.unsplash.com/photo-1584776296944-ab6fb57b0bdd?w=300&auto=format&fit=crop&q=60';};this.src='img/${prod.id}.png';};this.src='img/${prod.id}.jpg';">

                        </div>
                        <button onclick="cambiarCantidad(${prod.id}, 1)" class="mt-3 w-full bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2 rounded-lg transition">
                            Agregar al carrito
                        </button>
                    </div>
                </div>`;
            });
            contenedor.innerHTML = html;
            document.getElementById('contador-resultados').innerText = `${listaAProcesar.length} productos`;
        }

        function filtrarProductos() {
            const texto = document.getElementById('input-buscador').value.toLowerCase();
            
            let filtrados = productos.filter(prod => {
                const coincideTexto = prod.nombre.toLowerCase().includes(texto);
                const coincideCat = (categoriaActual === 'todos' || prod.categoria === categoriaActual);
                return coincideTexto && coincideCat;
            });

            renderizarProductos(filtrados);
        }

        function filtrarCategoria(categoria, boton) {
            categoriaActual = categoria;
            
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-red-800 text-white hover:bg-red-900 px-3 py-1 rounded-full text-xs font-semibold transition";
            });
            boton.className = "cat-btn bg-white text-red-600 px-3 py-1 rounded-full text-xs font-bold transition shadow-sm";

            filtrarProductos();
        }

        function cambiarCantidad(idProducto, cantidadCambio) {
            if (!carrito[idProducto]) {
                carrito[idProducto] = 0;
            }
            
            let nuevaCantidad = carrito[idProducto] + cantidadCambio;

            if (nuevaCantidad > stockMaximo) {
                alert("⚠️ Límite de stock: Solo tenemos 10 unidades disponibles.");
                return;
            }

            if (nuevaCantidad <= 0) {
                delete carrito[idProducto];
            } else {
                carrito[idProducto] = nuevaCantidad;
            }

            actualizarCarrito();
        }

        function vaciarCarrito() {
            carrito = {};
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const lista = document.getElementById('lista-carrito');
            let total = 0;
            let html = '';

            for (const id in carrito) {
                const prod = productos.find(p => p.id == id);
                const cantidad = carrito[id];
                const subtotal = prod.precio * cantidad;
                total += subtotal;

                html += `
                <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                    <div class="pr-2">
                        <p class="font-medium text-gray-800 text-xs">${prod.nombre}</p>
                        <p class="text-xs text-gray-400">$${prod.precio} x u.</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center border rounded-lg bg-gray-50 overflow-hidden">
                            <button onclick="cambiarCantidad(${prod.id}, -1)" class="px-2 py-0.5 text-gray-600 hover:bg-gray-200 text-xs font-bold">-</button>
                            <span class="px-2 text-xs font-bold">${cantidad}</span>
                            <button onclick="cambiarCantidad(${prod.id}, 1)" class="px-2 py-0.5 text-gray-600 hover:bg-gray-200 text-xs font-bold">+</button>
                        </div>
                        <span class="font-bold text-xs text-gray-700 w-12 text-right">$${subtotal}</span>
                    </div>
                </div>`;
            }

            if (Object.keys(carrito).length === 0) {
                lista.innerHTML = '<p class="italic text-gray-400 text-center py-4">El carrito está vacío.</p>';
            } else {
                lista.innerHTML = html;
            }

            document.getElementById('total-precio').innerText = total;

            const divRetiro = document.getElementById('mensaje-retiro');
            const divEnvio = document.getElementById('opcion-envio');
            const faltaEnvio = document.getElementById('falta-envio');

            if (total >= minimoParaEnvio) {
                divRetiro.classList.add('hidden');
                divEnvio.classList.remove('hidden');
            } else {
                divRetiro.classList.remove('hidden');
                divEnvio.classList.add('hidden');
                faltaEnvio.innerText = `Te faltan $${minimoParaEnvio - total} para habilitar el envío.`;
            }
        }

        function enviarWhatsApp() {
            let total = parseInt(document.getElementById('total-precio').innerText);
            if (total === 0) {
                alert("El carrito está vacío.");
                return;
            }

            let detallePedido = "Hola, quiero confirmar este pedido:\n\n";
            for (const id in carrito) {
                const prod = productos.find(p => p.id == id);
                detallePedido += `- ${carrito[id]}x ${prod.nombre} ($${prod.precio * carrito[id]})\n`;
            }

            let metodo = total >= minimoParaEnvio ? "Envío a domicilio" : "Retiro por el local";
            detallePedido += `\n*TOTAL: $${total}*\n*Método:* ${metodo}`;

            let telefono = "5493810000000"; 
            let url = `https://wa.me/${telefono}?text=${encodeURIComponent(detallePedido)}`;
            window.open(url, "_blank");
        }

        renderizarProductos(productos);
    </script>
