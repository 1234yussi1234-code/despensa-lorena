        let carrito = {}; 
        const minimoParaEnvio = 15000;
        const stockMaximo = 10;

        function renderizarProductos() {
            const contenedor = document.getElementById('contenedor-productos');
            let html = '';
            
            productos.forEach(prod => {
                html += `
                <div class="bg-white rounded-lg shadow-md overflow-hidden flex flex-col justify-between hover:shadow-lg transition">
                    <div class="h-40 bg-gray-200 flex flex-col items-center justify-center text-gray-500 text-sm p-4 text-center">
                        <svg class="w-8 h-8 mb-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span>Falta foto: ${prod.img}</span>
                    </div>
                    <div class="p-4">
                        <h3 class="font-bold text-gray-800">${prod.nombre}</h3>
                        <p class="text-blue-600 font-bold mt-1">$${prod.precio}</p>
                        <button onclick="agregarAlCarrito(${prod.id})" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded">
                            Agregar
                        </button>
                    </div>
                </div>`;
            });
            contenedor.innerHTML = html;
        }

        function agregarAlCarrito(idProducto) {
            if (!carrito[idProducto]) {
                carrito[idProducto] = 1;
            } else {
                if (carrito[idProducto] >= stockMaximo) {
                    alert("⚠️ Límite de stock: Solo tenemos 10 unidades disponibles de este producto.");
                    return;
                }
                carrito[idProducto]++;
            }
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const lista = document.getElementById('lista-carrito');
            let total = 0;
            let html = '';

            for (const id in carrito) {
                const prod = productos.find(p => p.id == id);
                const cantidad = carrito[id];
                const subtotal = prod.precio * cantidad;
                total += subtotal;

                html += `
                <div class="flex justify-between border-b pb-1">
                    <span>${cantidad}x ${prod.nombre}</span>
                    <span class="font-semibold">$${subtotal}</span>
                </div>`;
            }

            if (Object.keys(carrito).length === 0) {
                lista.innerHTML = '<p class="italic text-gray-400">El carrito está vacío.</p>';
            } else {
                lista.innerHTML = html;
            }

            document.getElementById('total-precio').innerText = total;

            const divRetiro = document.getElementById('mensaje-retiro');
            const divEnvio = document.getElementById('opcion-envio');
            const faltaEnvio = document.getElementById('falta-envio');

            if (total >= minimoParaEnvio) {
                divRetiro.classList.add('hidden');
                divEnvio.classList.remove('hidden');
            } else {
                divRetiro.classList.remove('hidden');
                divEnvio.classList.add('hidden');
                faltaEnvio.innerText = `Te faltan $${minimoParaEnvio - total} para habilitar el envío.`;
            }
        }

        function enviarWhatsApp() {
            let total = parseInt(document.getElementById('total-precio').innerText);
            if (total === 0) {
                alert("El carrito está vacío.");
                return;
            }

            let detallePedido = "Hola, quiero confirmar este pedido:\n\n";
            for (const id in carrito) {
                const prod = productos.find(p => p.id == id);
                detallePedido += `- ${carrito[id]}x ${prod.nombre} ($${prod.precio * carrito[id]})\n`;
            }

            let metodo = total >= minimoParaEnvio ? "Envío a domicilio" : "Retiro por el local";
            detallePedido += `\n*TOTAL: $${total}*\n*Método:* ${metodo}`;

            let telefono = "5493810000000"; 
            let url = `https://wa.me/${telefono}?text=${encodeURIComponent(detallePedido)}`;
            window.open(url, "_blank");
        }

        renderizarProductos();
